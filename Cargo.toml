[package]
name = "libsignal-dezire"
version = "0.1.146"
edition = "2024"
repository= "https://github.com/nijhum-in/libsignal-dezire"
license= "AGPL-3.0-only"
description = "A rust implementation of signal protocol"

[dependencies]
curve25519-dalek = {version ="4.1.3", features = ["digest"] }
rand_core = {version = "0.6.4", features=[ "getrandom" ]}
sha2 = "0.10.9"
subtle = "2.6.1"
x25519-dalek = {version= "2.0.1", features = ["static_secrets", "serde"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = { version = "0.21.1", optional = true }
hkdf = "0.12.4"
zeroize = { version = "1.6", features = ["derive", "zeroize_derive"] }
aes = "0.8.4"
aes-gcm = "0.10.3"
cbc = { version = "0.1.2", features = ["alloc"] }
hmac = "0.12.1"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]


[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3       
lto = true          
strip = true       
codegen-units = 1   
panic = "abort"    

[features]
ffi = []
jni = ["dep:jni"]
